name: Build victory.exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml in the repo pins Rust 1.98.1 and the MSVC target
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build release exe
        run: cargo build --release -p victory
      - uses: actions/upload-artifact@v4
        with:
          name: victory-exe
          path: target/release/victory.exe
